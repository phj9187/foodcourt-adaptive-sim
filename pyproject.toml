[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "foodcourt-adaptive-sim"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "torch>=2.6,<3"]
[project.scripts]
foodcourt-adaptive = "kiosk_adaptive.study:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
kiosk_adaptive = ["data/*.json"]

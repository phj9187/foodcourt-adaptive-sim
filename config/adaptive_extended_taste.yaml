# Long main experiment with HUMAN-READABLE dish tastes and kiosk input time (2026-11-10).
# 27 objectives (24 LHS + 3 boundary) x 5 independent replicas = 135 jobs.
# Changes vs adaptive_extended.yaml:
#  - input_minutes 0.5: 7 personal inputs at ~4 s each, added to the kiosk time of customers
#    served by input-based arms (PPO and rule controls).
#  - taste_model named: the three taste axes are spicy (맵기), salty (짠맛) and rich (기름진 정도);
#    each dish takes its anchor menu's assumed 5-level profile (data/menu_anchors.json) plus a
#    small per-vendor recipe variation (dish_taste_sd), instead of unnamed random numbers.
seed: 20261108
lhs_samples: 24
powers: [1.0]
replicas: 5
train_courts: 36
validation_courts: 8
test_courts: 24
training_blocks: 240
period_days: 14
visitors: 150
venue_types: [campus]
demand_mode: exogenous
demand_scale: 1.0
behaviour_worlds: [mixed_logit, satisficing, lexicographic]
comparison_controls: true
rule_controls: true
reward_mode: decomposed
gae_lambda: 0.95
baseline_audit: true
evaluation_repeats: 2
validation_every: 24
ppo_epochs: 4
hidden: 48
threads: 1
input_minutes: 0.5
taste_model: named
dish_taste_sd: 0.06
